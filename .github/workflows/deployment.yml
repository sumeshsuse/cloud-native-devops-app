name: CI/CD Pipeline - Build, Scan, Push and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image (load locally, don't push yet)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/cloud-native-devops-app/backend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/cloud-native-devops-app/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Scan backend image before pushing
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/cloud-native-devops-app/backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/cloud-native-devops-app/backend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/cloud-native-devops-app/backend:latest
          cache-from: type=gha,scope=backend

      - name: Build frontend image (load locally, don't push yet)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/cloud-native-devops-app/frontend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/cloud-native-devops-app/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Scan frontend image before pushing
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/cloud-native-devops-app/frontend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/cloud-native-devops-app/frontend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/cloud-native-devops-app/frontend:latest
          cache-from: type=gha,scope=frontend

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name practice-cluster --region us-east-1

      - name: Deploy with Helm
        run: |
          helm upgrade --install suse-app helm/suse-app \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }}